name: Reader smoke
on:
  pull_request:
    paths:
      - 'src/core/pages.ts'
      - 'src/core/pagePhysics.ts'
      - 'src/core/book.ts'
      - 'src/core/runtime.ts'
      - 'src/main.tsx'
      - 'browser-tests/**'
      - 'playwright.config.ts'
      - '.github/workflows/reader-smoke.yml'
      - 'package.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reader-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reader-test-results
          path: test-results/
          if-no-files-found: ignore
