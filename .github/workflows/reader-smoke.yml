name: Reader smoke
on:
  pull_request:
    paths:
      - 'src/core/paperEdge.ts'
      - 'src/editor/**'
      - 'src/core/workspace.ts'
      - 'src/core/schema.ts'
      - 'src/style.css'
      - 'src/core/pages.ts'
      - 'src/core/pageGpu.ts'
      - 'src/core/pageChain.ts'
      - 'src/core/pageWindow.ts'
      - 'src/core/stackGeometry.ts'
      - 'src/core/stackProfile.ts'
      - 'src/core/referenceScene.ts'
      - 'src/core/readingCamera.ts'
      - 'scripts/fixtures/**'
      - 'src/core/paperShading.ts'
      - 'src/core/textureWarm.ts'
      - 'src/core/bindingGeometry.ts'
      - 'src/core/pressReference.ts'
      - 'src/core/pagePhysics.ts'
      - 'src/core/chunkMotion.ts'
      - 'src/core/book.ts'
      - 'src/core/geometry.ts'
      - 'src/core/runtime.ts'
      - 'src/main.tsx'
      - 'browser-tests/**'
      - 'playwright.config.ts'
      - '.github/workflows/reader-smoke.yml'
      - 'package.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reader-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser -- browser-tests/reader.spec.ts browser-tests/touch-reader.spec.ts browser-tests/visual-defects.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-test-results
          path: test-results/
          if-no-files-found: ignore

  workspace:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser -- browser-tests/workspace.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workspace-test-results
          path: test-results/
          if-no-files-found: ignore
