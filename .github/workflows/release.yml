name: Publish release
on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（例如 0.6.0）'
        required: true
        type: string
      commit:
        description: '已经验收并部署的 main 完整 SHA'
        required: true
        type: string
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact main and successful deployment
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$COMMIT"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$COMMIT"
          test "$(node -p 'require("./package.json").version')" = "$VERSION"
          for workflow in ci.yml pages.yml; do
            count=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?branch=main&head_sha=$COMMIT&status=success" --jq '.total_count')
            test "$count" -gt 0
          done
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo 'Release already exists' >&2
            exit 1
          fi
      - run: npm install --no-audit --no-fund
      - run: npm test && npm run build
      - name: Build and verify static archive
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          test -s dist/index.html
          (cd dist && zip -qr "../Book3D-Studio-v$VERSION.zip" .)
          unzip -t "Book3D-Studio-v$VERSION.zip"
          sha256sum "Book3D-Studio-v$VERSION.zip" > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - name: Publish exact version
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$COMMIT"
          tag_commit=$(git ls-remote origin "refs/tags/v$VERSION" | cut -f1)
          test -z "$tag_commit" || test "$tag_commit" = "$COMMIT"
          gh release create "v$VERSION" --target "$COMMIT" --title "Book3D Studio v$VERSION" --notes-file CHANGELOG.md "Book3D-Studio-v$VERSION.zip" SHA256SUMS.txt
          gh release view "v$VERSION" --json tagName,url,assets
